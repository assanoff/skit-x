name: Release

# Triggered by pushing a semver tag, e.g.
#   make release V=v0.1.0      (or: git tag v0.1.0 && git push origin v0.1.0)
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub Release and upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: skit-x
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: assanoff/skit
          path: skit

      # Newest patch of the go.mod Go version: the binaries embed the stdlib.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: skit-x/go.mod
          check-latest: true
          cache-dependency-path: skit-x/go.sum

      - name: Test
        working-directory: skit-x
        run: make test

      - name: Build versioned binaries
        working-directory: skit-x
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          ldflags="-s -w -X github.com/assanoff/skit-x/internal/cmd.version=${VERSION}"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            out="dist/skit-x_${VERSION}_${os}_${arch}"
            echo ">> building $out"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
              go build -trimpath -ldflags "$ldflags" -o "$out" .
          done
          ( cd dist && sha256sum skit-x_* > checksums.txt )

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          files: skit-x/dist/*
