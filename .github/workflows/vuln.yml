name: Vuln

# New entries in the Go vulnerability database show up without any code
# change, so besides every push and PR the scan also runs daily. The SDK is
# checked out next to this repo for the local replace, as in ci.yml.
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: skit-x
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: assanoff/skit
          path: skit
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: skit-x/go.mod
          check-latest: true
          cache-dependency-path: skit-x/go.sum
      - name: govulncheck
        working-directory: skit-x
        run: make vuln
