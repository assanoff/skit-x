name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# The module uses `replace github.com/assanoff/skit => ../skit`, so
# the SDK must sit next to this repo. Every job checks both repos out into
# sibling directories under the workspace and runs from ./skit-x.
#
# Go comes from the go directive in go.mod; check-latest picks the newest patch
# release, so stdlib fixes arrive without a toolchain bump. Actions are pinned
# by commit SHA; Dependabot keeps the SHAs and version comments current.
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: skit-x
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: assanoff/skit
          path: skit
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: skit-x/go.mod
          check-latest: true
          cache-dependency-path: skit-x/go.sum
      - name: Build
        working-directory: skit-x
        run: go build ./...
      - name: Vet
        working-directory: skit-x
        run: go vet ./...
      - name: Test
        working-directory: skit-x
        run: make test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: skit-x
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: assanoff/skit
          path: skit
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: skit-x/go.mod
          check-latest: true
          cache-dependency-path: skit-x/go.sum
      # Keep version in sync with GOLANGCI in the Makefile.
      - uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          version: v2.14.0
          working-directory: skit-x
      - name: Project rules, go fix and go.mod checks
        working-directory: skit-x
        run: make lint-rules fix-check tidy-check

  # Integration tests stand up Postgres and RabbitMQ via testcontainers; the
  # ubuntu runner ships with Docker, so they run unguarded here (locally they
  # are skipped under `go test -short`).
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: skit-x
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: assanoff/skit
          path: skit
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: skit-x/go.mod
          check-latest: true
          cache-dependency-path: skit-x/go.sum
      - name: Integration tests
        working-directory: skit-x
        run: go test -count=1 -timeout 20m ./internal/tests/...

  # Contract diff gates. This service exposes three contracts to consumers; each
  # is diffed against the latest release tag (or the default branch before the
  # first tag). On v0.x these report but never fail the build — a major bump is a
  # deliberate decision (see the Makefile release targets). The Go and REST
  # tools run through the Makefile, which pins their versions.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: skit-x
          fetch-depth: 0 # tags + history needed for the baselines
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: assanoff/skit
          path: skit
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: skit-x/go.mod
          check-latest: true
          cache-dependency-path: skit-x/go.sum
      - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          version: 1.73.0
          setup_only: true

      - name: Go API (gorelease)
        working-directory: skit-x
        run: make gorelease || true

      - name: gRPC (buf breaking)
        working-directory: skit-x
        # Compare the proto module against the same path on the default branch.
        run: |
          buf breaking proto \
            --against "https://github.com/${{ github.repository }}.git#subdir=proto,ref=${{ github.event.repository.default_branch }}" \
            || echo "::warning::gRPC contract has a breaking change — bump a major"

      - name: REST (oasdiff)
        working-directory: skit-x
        # Regenerate the spec (a swag failure fails the step), then diff it
        # against the spec committed at the latest tag; breaking-rest skips
        # until the first tag exists.
        run: |
          make openapi
          make breaking-rest || echo "::warning::REST contract has a breaking change — bump a major"
