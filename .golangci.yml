# golangci-lint v2 config generated by skit. The same linter set as the skit SDK;
# run it with `make lint`, everything CI checks with `make check`.
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    # correctness
    - asasalint
    - containedctx
    - contextcheck
    - copyloopvar
    - durationcheck
    - errcheck
    - errchkjson
    - errorlint
    - exhaustive
    - exhaustruct_v5
    - fatcontext
    - forcetypeassert
    - gochecksumtype
    - govet
    - ineffassign
    - makezero
    - nilerr
    - nilnesserr
    - nilnil
    - predeclared
    - reassign
    - recvcheck
    - staticcheck
    - unparam
    - unused
    - wastedassign
    # resources and I/O: response bodies, rows, spans, request contexts
    - bodyclose
    - noctx
    - rowserrcheck
    - spancheck
    - sqlclosecheck
    - unqueryvet
    # security and dependencies
    - asciicheck
    - bidichk
    - depguard
    - forbidigo
    - gocheckcompilerdirectives
    - gomoddirectives
    - gosec
    # idioms and documentation
    - canonicalheader
    - dupword
    - embeddedstructfieldcheck
    - errname
    - exptostd
    - gocritic
    - godoclint
    - godot
    - iface
    - inamedparam
    - intrange
    - mirror
    - misspell
    - modernize
    - perfsprint
    - protogetter
    - revive
    - sloglint
    - unconvert
    - usestdlibvars
    - usetesting
    - whitespace
    - wrapcheck
    # complexity and duplication
    - dupl
    - gochecknoinits
    - gocognit
    - goconst
    - gocyclo
    - nakedret
    - nestif
    - prealloc
    # tests and nolint directives
    - nolintlint
    - thelper
    - tparallel
  settings:
    depguard:
      rules:
        main:
          deny:
            - pkg: github.com/stretchr/testify
              desc: tests use github.com/matryer/is
        # One semconv version, the one skit uses: mixed versions drift attribute
        # names and break the schema URL of the Resource.
        semconv:
          list-mode: lax
          allow: [go.opentelemetry.io/otel/semconv/v1.43.0]
          deny:
            - pkg: go.opentelemetry.io/otel/semconv
              desc: semconv is pinned to v1.43.0, the version of skit
    dupword:
      ignore: [nil] # "(nil, nil)" in doc comments
    errcheck:
      # Writes to stdout/stderr (CLI progress, log lines) don't warrant error
      # handling; everything else must still be checked.
      exclude-functions: [fmt.Fprint, fmt.Fprintf, fmt.Fprintln]
    exhaustive:
      default-signifies-exhaustive: true
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^trace\.Span\.RecordError$
          msg: mark the span with otel.SetError (status Error and error.type); the details go to the log record
    exhaustruct_v5:
      explicit-mode: true # only types marked //exhaustruct:enforce
    gomoddirectives:
      replace-local: true # `skit new --replace` co-develops against a local SDK
    gocognit:
      min-complexity: 30
    gocritic:
      enabled-tags: [diagnostic, performance, style, experimental, opinionated]
      disabled-checks: [wrapperFunc, hugeParam, rangeValCopy, unnamedResult, whyNoLint]
    gocyclo:
      min-complexity: 20
    godoclint:
      default: basic
      enable: [require-doc, require-pkg-doc, no-unused-link]
    gosec:
      excludes:
        - G704 # SSRF taint analysis: false positive for upstream HTTP clients
        - G705 # XSS taint analysis: false positive (JSON error bodies via errs)
    govet:
      enable-all: true
      disable: [fieldalignment]
    misspell:
      locale: US
    nestif:
      min-complexity: 5
    nilnil:
      # A nil func means "nothing to do" by contract (dim.CleanupFunc without
      # cleanup, a request without a body), so func results are not checked.
      checked-types: [chan, iface, map, ptr, uintptr, unsafeptr]
    nolintlint:
      require-explanation: true
      require-specific: true
    recvcheck:
      exclusions: ["*.Value"] # driver.Valuer needs a value receiver, Scan a pointer one
    revive:
      enable-default-rules: true
      rules:
        - name: atomic
        - name: bool-literal-in-expr
        - name: comment-spacings
        - name: constant-logical-expr
        - name: datarace
        - name: deep-exit
        - name: defer
        - name: early-return
        - name: identical-branches
        - name: modifies-value-receiver
        - name: redundant-import-alias
        - name: unconditional-recursion
        - name: unnecessary-stmt
        - name: use-any
        - name: waitgroup-by-value
    sloglint:
      context: all   # the ctx carries the span the record is correlated with
      no-global: all # log through the injected *slog.Logger
    staticcheck:
      checks: [all]
    wrapcheck:
      ignore-package-globs: [github.com/assanoff/skit-x/*, github.com/assanoff/skit/*]
      extra-ignore-sigs:
        - .Err()        # ctx.Err() is returned as is
        - .Write(       # ResponseWriter / io.Writer wrappers pass the error through
        - .Handle(      # slog.Handler wrappers
        - .RoundTrip(   # http.RoundTripper wrappers
        - status.Error( # a gRPC status must not be wrapped
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters: [bodyclose, containedctx, contextcheck, dupl, errcheck, exhaustruct_v5,
          forcetypeassert, gocritic, goconst, godoclint, gosec, noctx, prealloc, unparam,
          unqueryvet, wrapcheck]
      - path: _test\.go
        linters: [revive, unused]
        text: unused-parameter
      # go vet's shadow check flags idiomatic `if err := ...` in tests; allow it.
      - path: _test\.go
        linters: [govet]
        text: "shadow:"
      # Generated mocks are not held to our style rules.
      - path: mocks/
        linters: [dupl, revive, unparam]
    paths: [third_party$, builtin$]

formatters:
  enable: [gofumpt, goimports]
  settings:
    goimports:
      local-prefixes: [github.com/assanoff/skit-x]
  exclusions:
    generated: lax
    paths: [third_party$, builtin$]
